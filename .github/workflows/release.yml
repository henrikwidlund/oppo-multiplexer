name: Release

on:
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  check-version:
    name: Check tag matches Cargo.toml version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Cargo.toml
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            Cargo.toml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Compare tag to Cargo.toml
        if: github.event_name == 'release'
        shell: bash
        run: |
          tag="${{ github.event.release.tag_name }}"
          tag_version="${tag#v}"
          cargo_version="$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          echo "tag=$tag (version $tag_version), Cargo.toml version=$cargo_version"
          if [ "$tag_version" != "$cargo_version" ]; then
            echo "::error::release tag '$tag' (version '$tag_version') does not match Cargo.toml version '$cargo_version'"
            exit 1
          fi

  release:
    name: Release native binaries
    needs: check-version
    permissions:
      id-token: write
      attestations: write
      artifact-metadata: write
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_ext: ""
          - os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bin_ext: ""
          - os: macos
            arch: amd64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bin_ext: ""
          - os: macos
            arch: arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            bin_ext: ""
          - os: windows
            arch: amd64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bin_ext: .exe
          - os: windows
            arch: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            bin_ext: .exe

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust
        run: rustup update stable && rustup default stable

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Pack
        shell: bash
        run: |
          release_name="oppo-multiplexer-${{ matrix.os }}-${{ matrix.arch }}"
          binary="target/${{ matrix.target }}/release/oppo-multiplexer${{ matrix.bin_ext }}"
          if [ "${{ matrix.os }}" = "windows" ]; then
            7z a -tzip "${release_name}.zip" "$binary"
          else
            tar -czvf "${release_name}.tar.gz" -C "target/${{ matrix.target }}/release" "oppo-multiplexer"
          fi

      - name: Publish
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            oppo-multiplexer*.zip
            oppo-multiplexer*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            oppo-multiplexer*.tar.gz
            oppo-multiplexer*.zip
