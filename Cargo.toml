[package]
name = "oppo-multiplexer"
version = "0.0.6"
edition = "2024"
description = "Multiplexes client connections onto a single TCP connection to the Oppo/Magnetar Blu-ray Player, broadcasting unsolicited updates to all clients"
repository = "https://github.com/henrikwidlund/oppo-multiplexer"
license = "MIT"
keywords = ["oppo", "magnetar", "proxy", "multiplexer", "tcp"]
categories = ["network-programming", "command-line-utilities"]

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
too_many_lines = "allow"
unreachable = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
exit = "deny"

[dependencies]
smol = "2.0.2"
futures-lite = "2.6.1"
socket2 = { version = "0.6.5", features = ["all"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(target_os = "linux")'.dependencies]
tracing-journald = "0.3.2"

[profile.release]
opt-level = "z"
strip = true
